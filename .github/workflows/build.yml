name: Build ReSkate
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # Stamped as ReSkate 2.1.3, the release this branch is built on, and marked as a modified
      # build (Random Stand-ins) so its logs and crash reports are never taken for official ReSkate.
      - name: Configure
        run: cmake --preset vs2022-x64 -DDINGOSDK_VERSION=2.1.3 -DDINGOSDK_MOD_ID=Random_Stand_Ins -DDINGOSDK_MOD_VERSION=1.1.0
      - name: Build
        run: cmake --build --preset release --parallel 4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ReSkate-${{ github.ref_name }}
          path: |
            build/vs2022-x64/Release/ReSkateLauncher.exe
            build/vs2022-x64/Release/ReSkate.dll
