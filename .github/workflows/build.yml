name: Build ReSkate (drone)
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset vs2022-x64 -DDINGOSDK_CARGO=DINGOSDK_CARGO-NOTFOUND  # skip the Rust Spotify device
      - name: Build
        run: cmake --build --preset release --parallel 4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ReSkate-drone
          path: |
            build/vs2022-x64/Release/ReSkateLauncher.exe
            build/vs2022-x64/Release/ReSkate.dll
