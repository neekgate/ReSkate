name: Build ReSkate
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # Stamped as ReSkate 2.1.3, the release this branch is built on, and marked as a modified
      # build (Random Stand-ins) so its logs and crash reports are never taken for official ReSkate.
      # A failing step also posts its error lines as annotations, readable without the full log.
      # cmake/Runtime.cmake looks for an import library in cargo's unpacked registry while it
      # configures, which a fresh runner does not have yet: fetch the Spotify helper's crates first.
      - name: Fetch Rust crates
        working-directory: SpotifyHelper
        run: cargo fetch --locked
      - name: Configure
        run: |
          cmake --preset vs2022-x64 "-DDINGOSDK_VERSION=2.1.3" "-DDINGOSDK_MOD_ID=Random_Stand_Ins" "-DDINGOSDK_MOD_VERSION=1.1.0" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content configure.log | Select-String -Pattern 'error|CMake Error|not found|could not' -CaseSensitive:$false |
              Select-Object -First 30 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            Get-Content configure.log -Tail 15 | ForEach-Object { Write-Output "::warning::$($_.Trim())" }
            exit 1
          }
      - name: Build
        run: |
          cmake --build --preset release --parallel 4 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Select-String -Pattern ': (fatal )?error|error:|FAILED' |
              Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ReSkate-${{ github.ref_name }}
          path: |
            build/vs2022-x64/Release/ReSkateLauncher.exe
            build/vs2022-x64/Release/ReSkate.dll
